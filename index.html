<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urlaubszitate Kolumbien</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            background-image: url("data:image/svg+xml,%3Csvg width='280' height='280' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='50' font-size='30'%3E🦜%3C/text%3E%3Ctext x='100' y='80' font-size='30'%3E🇨🇴%3C/text%3E%3Ctext x='190' y='40' font-size='30'%3E☕%3C/text%3E%3Ctext x='30' y='140' font-size='30'%3E🏔️%3C/text%3E%3Ctext x='120' y='160' font-size='30'%3E🌴%3C/text%3E%3Ctext x='210' y='120' font-size='30'%3E🦋%3C/text%3E%3Ctext x='50' y='220' font-size='30'%3E🇨🇴%3C/text%3E%3Ctext x='150' y='250' font-size='30'%3E🦜%3C/text%3E%3Ctext x='240' y='190' font-size='30'%3E☕%3C/text%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 280px 280px;
            background-position: 0 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .quote-text {
            font-size: 22px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
            min-height: 80px;
        }

        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            background-color: #555;
        }

        .btn:active {
            background-color: #222;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .quote-text {
                font-size: 18px;
                margin-bottom: 25px;
            }

            .btn {
                padding: 10px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Urlaubszitate Kolumbien 25/26</h1>
        <div class="quote-text" id="quoteText">Klick auf Mehr!</div>
        <button class="btn" onclick="getQuote()">Mehr! 😍</button>
        <footer>Designed with ❤️ for Eike</footer>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkdLW5rYrEpmILZW5YQ5RtwDtzI8F8M36PhFk7qf8Z0H1yvm9c7UZvKDmic8n2SG2YbSVILAa2gUM5/pub?gid=0&single=true&output=csv";
        
        let quotes = [];
        let lastQuoteIndex = -1;

        // Passwort-Schutz
        function protectPage() {
            const password = prompt("🔐 Bitte Passwort eingeben:");
            if (password !== "0815") {
                document.body.innerHTML = "";
                alert("❌ Falsches Passwort!");
                return false;
            }
            loadQuotes();
        }

        // CSV von Google Sheets laden und parsen
        async function loadQuotes() {
            try {
                const response = await fetch(SHEET_URL);
                const csv = await response.text();
                
                // CSV parsen (simple parser)
                const lines = csv.trim().split('\n');
                quotes = lines.slice(1) // Header überspringen
                    .map(line => {
                        // CSV-Anführungszeichen entfernen
                        return line.replace(/^"|"$/g, '').trim();
                    })
                    .filter(quote => quote.length > 0); // Leere Zeilen filtern
                
                if (quotes.length > 0) {
                    getQuote();
                } else {
                    document.getElementById('quoteText').textContent = "Keine Zitate gefunden 😟";
                }
            } catch (error) {
                console.error("Fehler beim Laden der Zitate:", error);
                document.getElementById('quoteText').textContent = "Fehler beim Laden der Zitate 😟";
            }
        }

        function getQuote() {
            if (quotes.length === 0) return;
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (randomIndex === lastQuoteIndex && quotes.length > 1);
            
            lastQuoteIndex = randomIndex;
            const quote = quotes[randomIndex];
            
            document.getElementById('quoteText').textContent = quote;
        }

        // Passwort-Check beim Laden
        window.addEventListener('load', protectPage);
    </script>
</body>
</html>
