<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .quote-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            font-style: italic;
            line-height: 1.6;
            min-height: 60px;
        }

        .quote-author {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .quote-text {
                font-size: 20px;
            }

            .btn {
                padding: 10px 25px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quote-text" id="quoteText">Click the button to get inspired!</div>
        <div class="quote-author" id="quoteAuthor"></div>
        <button class="btn" onclick="getQuote()">New Quote</button>
    </div>

    <script>
        const quotes = [
            "Dude, you're a bit chill.. the wedding starts in 10 minutes!",
            "And here is our butterfly collection.",
            "Ich habe gerade aus Versehen sehr langen Blickkontakt mit einem schwulen Kolumbianer gehabt.",
            "Krass, dass du ne elektrische Zahnbürste mit in den Urlaub genommen hast.",
            "Keine Worte, nur wie Eike in der allerersten Unterkunft und der Decke liegt, als Nuria aus dem Bad kommt.",
            "Kannst du mir helfen, Wasser aus dem Kanister in der Küche zu holen?",
            "Affenkacke",
            "And this is a mystery in our collection. Nobody knows how the indigenous people were able to make a hole into the stone, because they shouldn't have had tools for that back then. Moving on.",
            "I like lattes.",
            "Why are there banana trees here?",
            "Hast du gerade den Whisky geext?",
            "Remember you paid money for this."
        ];

        let lastQuoteIndex = -1;

        function getQuote() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (randomIndex === lastQuoteIndex && quotes.length > 1);
            
            lastQuoteIndex = randomIndex;
            const quote = quotes[randomIndex];
            
            document.getElementById('quoteText').textContent = `"${quote}"`;
            document.getElementById('quoteAuthor').textContent = "";
        }

        // Load a quote on page load
        window.addEventListener('load', getQuote);
    </script>
</body>
</html>
