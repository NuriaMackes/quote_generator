<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urlaubszitate Kolumbien</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            background-image: url("data:image/svg+xml,%3Csvg width='280' height='280' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='50' font-size='30'%3E🦜%3C/text%3E%3Ctext x='100' y='80' font-size='30'%3E🇨🇴%3C/text%3E%3Ctext x='190' y='40' font-size='30'%3E☕%3C/text%3E%3Ctext x='30' y='140' font-size='30'%3E🏔️%3C/text%3E%3Ctext x='120' y='160' font-size='30'%3E🌴%3C/text%3E%3Ctext x='210' y='120' font-size='30'%3E🦋%3C/text%3E%3Ctext x='50' y='220' font-size='30'%3E🇨🇴%3C/text%3E%3Ctext x='150' y='250' font-size='30'%3E🦜%3C/text%3E%3Ctext x='240' y='190' font-size='30'%3E☕%3C/text%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 280px 280px;
            background-position: 0 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .quote-text {
            font-size: 22px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
            min-height: 80px;
        }

        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            background-color: #555;
        }

        .btn:active {
            background-color: #222;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .quote-text {
                font-size: 18px;
                margin-bottom: 25px;
            }

            .btn {
                padding: 10px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Urlaubszitate Kolumbien 25/26</h1>
        <div class="quote-text" id="quoteText">Klick auf Mehr!</div>
        <button class="btn" onclick="getQuote()">Mehr! 😍</button>
        <footer>Designed with ❤️ for Eike</footer>
    </div>

    <script>
        // Verschlüsselte Datei im Repo (erstellt mit encrypt.js)
        const ENC_FILE = 'zitate.enc.json';
        let quotes = [];
        let lastQuoteIndex = -1;

        // Passwort abfragen und Datei laden/entschlüsseln
        async function protectPage() {
            const password = prompt("🔐 Bitte Passwort eingeben:");
            if (!password) {
                document.body.innerHTML = "";
                return;
            }

            try {
                await loadAndDecrypt(password);
                document.getElementById('quoteText').textContent = "Klick auf Mehr!";
                getQuote();
            } catch (err) {
                console.error('Entschlüsselungsfehler', err);
                document.getElementById('quoteText').textContent = '⚠️ Entschlüsselungsfehler oder falsches Passwort.';
                document.body.insertAdjacentHTML('beforeend', '<p style="color:#c33">Passwort falsch oder Datei nicht vorhanden.</p>');
                const btn = document.querySelector('.btn');
                if (btn) btn.disabled = true;
            }
        }

        async function loadAndDecrypt(password) {
            const resp = await fetch(ENC_FILE);
            if (!resp.ok) throw new Error('Encrypted file not found');
            const obj = await resp.json();

            const salt = base64ToArrayBuffer(obj.salt);
            const iv = base64ToArrayBuffer(obj.iv);
            const tag = base64ToArrayBuffer(obj.tag);
            const ct = base64ToArrayBuffer(obj.ciphertext);

            const iterations = obj.meta?.iterations || 200000;

            // PBKDF2 derive
            const pwUtf8 = new TextEncoder().encode(password);
            const baseKey = await crypto.subtle.importKey('raw', pwUtf8, 'PBKDF2', false, ['deriveKey']);
            const derivedKey = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );

            // AES-GCM expects ciphertext with tag appended
            const ctArr = new Uint8Array(ct.byteLength + tag.byteLength);
            ctArr.set(new Uint8Array(ct), 0);
            ctArr.set(new Uint8Array(tag), ct.byteLength);

            const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(iv) }, derivedKey, ctArr.buffer);
            const plainText = new TextDecoder().decode(plainBuf);

            quotes = plainText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            if (!quotes.length) throw new Error('Leere Zitatliste nach Entschlüsselung');
        }

        function base64ToArrayBuffer(b64) {
            const binary = atob(b64);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function getQuote() {
            if (quotes.length === 0) return;

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (randomIndex === lastQuoteIndex && quotes.length > 1);

            lastQuoteIndex = randomIndex;
            document.getElementById('quoteText').textContent = quotes[randomIndex];
        }

        window.addEventListener('load', protectPage);
    </script>
</body>
</html>
